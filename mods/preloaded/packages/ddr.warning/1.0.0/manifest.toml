format_version = 5
id = "ddr.warning"
version = "1.0.0"
name = "Translated Screens"
author = "ddr-1st-recomp"
description = "The Japanese left on screen is artwork, not text a translator could reach: the health-and-safety screen, every memory-card message, the green band on the main menu, the pad hints at the foot of mode select and song select, and the description of each mode. This uploads redrawn versions into video memory in their place, at the original size and in the original colours."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLPM-86222"

[[feature]]
id = "translate"
name = "Translate the Japanese screens"
description = "Disabled by default. Each picture is replaced in video memory through the same CPU-to-VRAM transfer the game itself uses, so nothing is patched and no image file travels with the game. What triggers a replacement is the picture itself, recognised by its own pixels rather than by which screen is showing -- the same video memory is reused between screens, so a page is only repainted when it really is holding the line we mean. A picture we have not catalogued simply stays Japanese instead of being replaced by the wrong one."
group = "Localization"
default_enabled = false

[[plugin]]
feature = "translate"
id = "ddr.warning.english"

[[option]]
feature = "translate"
id = "language"
label = "Language"
description = "Which artwork to upload. Both cover every screen the mod knows: CAUTION, all eight memory-card messages, the menu band, the pad hints and the three mode descriptions."
group = "Localization"
type = "choice"
default = "english"

[[option.choice]]
value = "english"
label = "English"

[[option.choice]]
value = "portuguese"
label = "Português (Brasil)"
