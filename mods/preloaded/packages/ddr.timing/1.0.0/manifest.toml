format_version = 5
id = "ddr.timing"
version = "1.0.0"
name = "Timing Calibration"
author = "ddr-1st-recomp"
description = "Shifts the music against the chart, so steps that feel perfect are judged perfect. Every screen, keyboard and pad adds its own delay, so the right value is personal -- this is the dial for finding it."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLPM-86222"

[[feature]]
id = "offset"
name = "Adjust the music offset"
description = "Disabled by default, which is the stock behaviour. The chart starts counting when the CD reports that playback began; a real drive needs time to settle before the first audio frame is audible, and the game was written around that. An emulated drive starts instantly, so the music runs slightly ahead of the chart and steps land early. Raising this restores that settle. It is read once, when a song starts playing, so a change applies from the next song on."
group = "Gameplay"
default_enabled = false

[[plugin]]
feature = "offset"
id = "ddr.timing.offset"

[[option]]
feature = "offset"
id = "music_delay_ms"
label = "Music delay (ms)"
description = "How much later the music starts, in milliseconds. 0 is stock. Try 100 and adjust: if steps that feel right are still judged early, raise it; if they start reading late, lower it. This can only move the music later -- if everything already reads late, the cushion to reduce is [audio] buffer_ms in game.toml."
group = "Gameplay"
type = "integer"
min = 0
max = 300
step = 10
default = 100
