format_version = 5
id = "ddr.background"
version = "1.0.0"
name = "Song Background"
author = "ddr-1st-recomp"
description = "Brightness of the scrolling background behind the arrows. Some backgrounds are busy enough to make the arrows hard to read; this dims them without touching anything else on screen."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLPM-86222"

[[feature]]
id = "dim"
name = "Dim the song background"
description = "Disabled by default. The background is not one image: it is a lattice of 64x32 textured quads drawn behind everything else, and each one carries a colour the hardware multiplies with its texture. This scales that colour. The arrows, the chart and the interface are untouched -- they are different primitives."
group = "Visual"
default_enabled = false

[[plugin]]
feature = "dim"
id = "ddr.background.dim"

[[option]]
feature = "dim"
id = "brightness"
label = "Background brightness"
description = "100 leaves the background as the game draws it; 0 makes it black. Values in between scale it, so the arrows stand out more the lower you go."
group = "Visual"
type = "integer"
min = 0
max = 100
step = 5
default = 50
