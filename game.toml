# Dance Dance Revolution 1st Mix (Japan) — SLPM-86222
# PSXRecomp static recompilation config
#
# Identity, digests and TOC fingerprint below were produced by
# psxrecomp/tools/new_project_layout/probe_disc.py from a legal dump.

[game]
name        = "Dance Dance Revolution 1st Mix"
id          = "SLPM-86222"
players     = 2
exe         = "disc/SLPM_862.22"
# No `disc` key on purpose. It would hold an absolute path to one machine's
# dump, which is both unshippable and untestable: with it set, this machine
# never exercises the path every other player takes. The disc comes from the
# player -- the launcher asks on first run and remembers the answer; `--disc`
# still overrides for scripted / headless runs, which have no picker.
#
# disc_crc is the data track's CRC32 (IEEE), the same digest DiscIdentity
# computes. This is the gate that refuses a dump this build was not
# recompiled from. Matches [prepare_disc] known_crc32 below.
disc_crc     = "74C201CF"
load_address = "0x80016000"
entry_pc     = "0x8001BA20"
text_size    = "0x00148800"
stack_base   = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir    = "disc"
bin_name   = "Dance Dance Revolution (Japan) (Track 01).bin"
cue_name   = "Dance Dance Revolution (Japan).cue"
boot_exe   = "SLPM_862.22"
known_sizes = [14935200]
known_md5 = [
  "57d6ae6568a77409abfc94ba1d695b62",
]
known_sha1 = [
  "03605ce9b3fea0f3455961577f815f2f47094a52",
]
known_crc32 = [
  "74c201cf",
]

[recompiler]
# The BIOS profile this game is recompiled against. Without it the recompiler
# looks for bios/SCPH1001.toml -- a retail dump this project neither ships nor
# needs -- and fails with a message that reads like a missing file rather than
# a missing setting. This build runs on the bundled OpenBIOS, and the path is
# inside the submodule now that the framework is not a sibling directory.
bios_config = "psxrecomp/bios/OpenBIOS.toml"

# Each address here makes the recompiler emit psx_mod_function_entry() at that
# function's entry. It is the only mod hook that survives a RELEASE build, and
# changing this LIST is the one thing in src/ddr_hooks.c that needs a
# regenerate -- the callbacks themselves rebuild in minutes.
#
# 0x8004A380  mode-select tick. Reads the pad and moves the cursor, so it is
#             the only place EXIT GAME's navigation can eat a direction before
#             the game acts on it.
# 0x80049F9C  the item-list drawer, func(mode, highlighted, brightness).
#             Draws the EXIT GAME line every frame (the game's own header call
#             is gated on two bits of a frame counter and blinks), and takes
#             the highlight away from every real item while EXIT is selected.
# 0x80022268  the 3D model emitter, once per scene entry. Where a scene entry
#             drawn twice in one interval is suppressed -- the freeze.
# 0x8007259C  the ordering-table merge. Ends the interval above, and is a
#             convenient once-a-frame place for the unlock mask.
# 0x8006F3E8  the animation driver. Reads the pointer that, when invalid,
#             starts the chain that ends in the freeze.
mod_function_entry_funcs = [
    "0x8004A380",
    "0x80049F9C",
    "0x80022268",
    "0x8007259C",
    "0x8006F3E8",
]
seeds   = "recompiler/seeds/seeds.txt"
out_dir = "generated"
# strict = false: bring-up found call sites the seed list does not reach yet.
# The probe reports 949 first-pass JAL seeds against the 1 we ship; adopting
# them changes what is generated, so it is a deliberate, separately tested
# step rather than a config tweak.
strict  = false

[audio]
# Output cushion = input-to-sound latency. DDR syncs arrows to CDDA, so keep it
# low; the framework default (180) puts the music ~audibly behind the chart.
# Raise toward 80-100 only if audio crackles.
buffer_ms = 60

[runtime]
window_title = "Dance Dance Revolution 1st Mix"

[controller]
multitap_analog = false

# Online mount gate: digests + track count + TOC fingerprint.
[netplay]
require_cue      = true
required_tracks  = 40
required_disc_fp = "a1166485800a37bcba8d629c25fd86411e007af3fa5e08eb9af526fbee35aa55"
